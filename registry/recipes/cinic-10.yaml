release: CINIC-10-institutional-ds2448
adapter: archive
source_url: https://github.com/BayesWatch/cinic-10
expected_count: 270000
scope: All 270000 original CINIC-10 images across train/valid/test (90000 each), with
  ten native classes and CIFAR/ImageNet source identity retained from filenames. No
  image regeneration or split reassignment. Original institutional MD5 verified; no
  publication approval.
adapter_config:
  archive_preparation: zip-store
  suffixes:
  - .png
  path_regex: (?P<split>train|valid|test)/(?P<label>airplane|automobile|bird|cat|deer|dog|frog|horse|ship|truck)/(?:(?:cifar10-(?P<cifar_split>train|test)-(?P<cifar_index>\d+))|(?:(?P<imagenet_synset>n\d+)_(?P<imagenet_index>\d+)))\.png
  label_indices:
    airplane: 0
    automobile: 1
    bird: 2
    cat: 3
    deer: 4
    dog: 5
    frog: 6
    horse: 7
    ship: 8
    truck: 9
  order: round_robin_label
  constant_fields:
    source_note: Original CINIC split and domain filename retained. CIFAR source split
      differs from the CINIC train/valid/test assignment.
files:
- source_name: CINIC-10.tar.gz
  url: https://datashare.ed.ac.uk/server/api/core/bitstreams/e8e186cc-2688-48f1-aa5a-3fda1a43f8b6/content
  bytes: 687544992
  sha256: 31b095acf6d75e25a9e028bae82a07a0f94ff6b00671be2802d34ac4efa81a9e
  format: tar.gz
  config_key: path
allowed_hosts:
- datashare.ed.ac.uk
