description: 'COCO source family with a local official 2017 validation release: 5,000 images,
  25,014 captions, and 36,781 object instances in 80 categories. Each caption example shares
  its original image asset and asset-scoped source boxes. Paper evidence below retains its original,
  sometimes distinct split or role; this local validation release does not assert that every
  cited paper used validation. Images remain local because the COCO Consortium does not own
  their copyright.'
