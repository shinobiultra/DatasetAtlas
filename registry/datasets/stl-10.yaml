description: Original Stanford STL-10 binary distribution with 5,000 labeled training
  images, 8,000 labeled test images, 100,000 unlabeled images, and ten predefined
  1,000-example training folds. The local reader preserves original labels and
  split order and encodes source pixels as lossless PNG only when an image is requested.
