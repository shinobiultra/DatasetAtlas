schema_version: '1.0'
id: saegis-clean-and-adversarial-splits
name: SAEgis clean and adversarial splits
aliases: []
description: 'SAEgis author-repository images at one pinned commit: 4,800 224x224 PNGs from NIPS17,
  LLaVA-Instruct-150K and Medical-Multimodal-Eval — clean originals (800 train, 100 dev, 100 test
  per source) and attacked variants (FOA-Attack, M-Attack, SSA-CWA; 100 dev and 100 test per source
  and attack). Each attacked image names its same-named clean counterpart (all 1,800 pairs checked
  by pixel similarity). Historical usage qualification: the paper calls the adversarial splits
  training and testing where the repository says dev and test, and the paper version was not compared
  with this commit.'
paper_ids:
- paper-d8a392188b9cf4d6
release: github-6365cbfc9e4de1e6df01624b793abbef09789cc8
adapter: structured_collection
adapter_config:
  annotations:
  - path_key: path
    format: jsonl
    split: all
    identity_prefix: saegis
    media_template: '{media_path}'
  mapping:
    id: source_id
    text: label
  fields:
    source_id: Source dataset, condition, attack, split and file index
    image_source:
      description: Source dataset of the clean image
      values:
      - NIPS17
      - LLaVA-Instruct-150K
      - Medical-Multimodal-Eval
    condition:
      description: Clean original or adversarially attacked
      values:
      - original
      - attacked
    attack:
      description: Attack method (absent for clean originals)
      values:
      - FOA-Attack
      - M-Attack
      - SSA-CWA
    split:
      description: Repository split (attacked images exist only for dev and test)
      values:
      - train
      - dev
      - test
    index:
      description: Repository file number (NIPS17 numbers files 0-999 across splits)
      dtype: number
    clean_counterpart: Path of the same-named clean original in the same split (attacked images
      only)
    media_path: Repository path of this image at the pinned commit
    git_blob_sha1: Git blob SHA-1 of the image file
    image_bytes:
      description: File size in bytes
      dtype: number
    label: Display label built from the structure above
