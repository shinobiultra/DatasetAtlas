description: 'RSVQA-LR: the author''s Zenodo Low Resolution remote-sensing VQA release (77,232 questions
  over 772 Sentinel-2 images, native train/val/test splits). RSVQA-HR and RSVQAxBEN are separate releases
  that are not prepared; the corpus''s survey-table mention of RS-VQA does not name a variant, so identity
  stays a candidate.'
