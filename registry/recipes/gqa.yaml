# A clean clone reads GQA's two official archives by ranges bound to their strong ETags (consistency fingerprints, not content hashes)
# instead of downloading 1.5 GB + 21.8 GB. The maintainer's active version joined a fully downloaded images.zip (SHA-256 02ce5c49...,
# recorded in its receipt); the files are the same, so questions, record IDs and the snapshot ID are unchanged.
description: Official GQA v1.2 validation-balanced population of 132,062 question-answer examples. Every referenced image ID is joined
  to the complete directory of the official image archive. Questions and images are read on request by HTTPS ranges bound to each archive's
  ETag; neither archive is downloaded. Training and other question splits are outside this explicitly scoped snapshot.
snapshot_id: gqa-v1.2-val-balanced-full-media-02ce5c49c793accd
