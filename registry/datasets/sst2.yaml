  source_archive_version_id: gAOv9nMgC092.oqzTRzZou2skIpI.QQJ
  population: GLUE SST-2 original ZIP train, dev, and unlabeled test TSVs converted losslessly to Parquet,
    70,042 rows
  fields:
    split:
      dtype: category
      description: Original GLUE split
      values:
      - train
      - dev
      - test
    label:
      dtype: category
      description: Original binary sentiment label 0 or 1; null for withheld GLUE test labels
      values:
      - 0
      - 1
    label_status:
      dtype: category
      description: Source labeled or withheld by GLUE
      values:
      - source_labeled
      - withheld_by_glue
    source_index:
      dtype: number
      description: Zero-based row/index within original split
    source_member:
      dtype: string
      description: Original member path in GLUE ZIP
    source_id:
      dtype: string
      description: Stable split:index key created for this conversion
