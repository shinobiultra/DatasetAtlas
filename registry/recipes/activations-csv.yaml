# Keep every released value, one complete neuron row at a time. Original lexical
# activation strings are unchanged; summary fields are explicitly Atlas-derived.
# The content-derived preparation snapshot differs from the older summary view.
release: 39dff5bd6dea67fc3ef350bc7b2312e5fcfc1493
adapter: structured
expected_count: 930
description: All 930 native SAE neuron rows from the checksum-pinned author CSV, each with all 50,000 original activation
  strings in source-column order. Summaries and their provenance are derived by Dataset Atlas; no ImageNet media or
  additional image identities are supplied by this activation table.
scope: Every native neuron row of metric_benchmark/activations.csv at the pinned author revision. Each example is one
  SAE neuron with 50,000 ordered original activation strings, not an individual image or activation cell.
source_url: https://github.com/ExplainableML/sae-for-vlm/blob/39dff5bd6dea67fc3ef350bc7b2312e5fcfc1493/metric_benchmark.tar.gz
adapter_config:
  format: jsonl
  sequential_index: true
  max_record_bytes: 2000000
  mapping:
    id: k
  fields:
    k:
      description: Native SAE neuron identifier
      dtype: string
    source_row_index:
      description: Atlas-derived zero-based native CSV row position
      dtype: number
    activation_values:
      description: Every original activation string, ordered by native columns a_1 through a_50000
      dtype: array
    activation_schema:
      description: Native neuron unit, source member, exact checked header pattern and header digest
      dtype: object
    value_count:
      description: Atlas-derived number of native activation columns
      dtype: number
    values_sha256:
      description: Atlas-derived SHA-256 of comma-joined original activation strings in source order
      dtype: string
    minimum:
      description: Atlas-derived minimum of parsed original numeric activations
      dtype: number
    maximum:
      description: Atlas-derived maximum of parsed original numeric activations
      dtype: number
    mean:
      description: Atlas-derived mean of parsed original numeric activations
      dtype: number
    nonzero_count:
      description: Atlas-derived count of nonzero original activations
      dtype: number
    summary_provenance:
      description: Producer, fields and method of the derived summaries; these are not authored CSV columns
      dtype: object
convert:
  name: activation_values
  params:
    member: metric_benchmark/activations.csv
    value_count: 50000
    max_output_bytes: 500000000
  count: 930
  rows_sha256: 41cffdfcdc77dc8107984a277e784cecfab684a97003ab67aabedaffe0336b19
files:
- source_name: metric_benchmark.tar.gz
  url: https://raw.githubusercontent.com/ExplainableML/sae-for-vlm/39dff5bd6dea67fc3ef350bc7b2312e5fcfc1493/metric_benchmark.tar.gz
  bytes: 21980821
  sha256: ef19b58be1cc9cb44b3948057e52d09907fd273c2935f9ab87a47989c100f5db
  format: tar.gz
  config_key: source_tar
allowed_hosts:
- raw.githubusercontent.com
- github.com
