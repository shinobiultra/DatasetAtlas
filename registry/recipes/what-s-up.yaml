    split: controlled_images
    correct_choice_index: 0
    text_from_first_choice: true
    media_paths_field: image_path
    media_path_remove_prefix: data/
    media_archive: controlled_images
    choices_field: caption_options
  - path_key: controlled_clevr_annotations
    split: controlled_clevr
    correct_choice_index: 0
    text_from_first_choice: true
    media_paths_field: image_path
