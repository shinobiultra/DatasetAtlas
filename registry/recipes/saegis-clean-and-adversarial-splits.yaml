# SAEgis' committed clean and adversarial images (author repository, pinned commit). The repository ships no table, so converters/adversarial_images.py
# derives one row per image from the checksum-pinned file inventory at registry/media/ (Git blob SHA-1 + length per file, written once from the repository
# tree at this commit). Images are fetched on demand from the pinned commit and verified against their Git blob SHA-1; the README is pinned only as provenance.
release: github-6365cbfc9e4de1e6df01624b793abbef09789cc8
adapter: structured_collection
expected_count: 4800
scope: 'All 4,800 images committed to the SAEgis author repository at the pinned commit: three source datasets (NIPS17, LLaVA-Instruct-150K, Medical-Multimodal-Eval),
  each with 800 train, 100 dev and 100 test clean originals, plus 100 dev and 100 test attacked variants from each of three attack methods (FOA-Attack,
  M-Attack, SSA-CWA). Every image is 224x224 and is fetched unchanged from the pinned commit, verified against its Git blob SHA-1. An attacked
  image''s clean counterpart is the original with the same file name in the same split (all 1,800 pairs checked by pixel similarity; see reports/saegis-pairing-verification-20261006.json).
  The repository has no licence file and the images derive from third-party datasets, so everything stays local.'
source_url: https://github.com/conan1024hao/SAEgis/tree/6365cbfc9e4de1e6df01624b793abbef09789cc8
