# papluca/language-identification (pinned Hugging Face revision): three CSVs (train, valid, test) read as they are published, no conversion. The corpus
# paper's footnote 7 names this exact dataset as the one its language-detection model was fine-tuned on; that is model-training lineage, not an evaluation set.
# The dataset has no upstream row IDs, so rows are identified by split and position within the pinned files (the snapshot ID derived from their checksums fixes the order).
release: hf-aa56583bf2bc52b0565770607d6fc3faebecf9e2
adapter: structured_collection
expected_count: 90000
scope: 'All 90,000 rows of the Hugging Face papluca/language-identification dataset at the pinned revision: 70,000 train, 10,000 validation and
  10,000 test texts, 3,500/500/500 per language, 20 languages, each with the author''s language label. The card gives no licence and lists extended
  amazon_reviews_multi, xnli and stsb_multi_mt sources. The corpus paper only cites this dataset as the one its language-detection model was fine-tuned
  on (footnote 7); it did not evaluate on it.'
source_url: https://huggingface.co/datasets/papluca/language-identification/tree/aa56583bf2bc52b0565770607d6fc3faebecf9e2
