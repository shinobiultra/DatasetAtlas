# revision, byte length and SHA-256 (all are plain Git blobs, so the SHA-256 is computed from the file and its Git blob SHA-1 was checked against the
# Hub listing). The 10,464 images are pinned by Hub LFS SHA-256 (one non-LFS file by Git blob SHA-1) in registry/media/multitrust.json,
# whose own SHA-256 is pinned in adapter_config. Images stay remote; only the 100 preview originals are kept locally.
# No source_url on purpose: a huggingface.co/datasets/<repo> URL would send `atlas previews fetch` to the sampled route, which builds no complete index.
# snapshot_id = "multitrust-<revision[:12]>-q<number of query files>-<first 16 hex of sha256 over these lines joined by newline>": the sorted lines
# source_name:bytes:sha256 of every file under `files`, then media_inventory:<sha256 of the inventory file>, tasks:<sha256 of the canonical JSON
# (sorted keys, no spaces, UTF-8) of adapter_config.tasks>, and preview_sampling:<canonical JSON of adapter_config.preview_sampling>. No budget is part of it.
# preview_media_transfer_bytes is the exact sum of the pinned sizes of every image of the 250 seeded candidates the worker may open to find 100 that decode;
# it is an upper bound computed from the pins, not a measurement (the measured transfer is in reports/multitrust-live-verification-20261009.json).
