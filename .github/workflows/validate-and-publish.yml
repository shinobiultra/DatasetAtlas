name: Validate and publish Dataset Atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated build to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# A newer run of the same ref replaces an older one; a deployment is never cancelled half way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.12'
          activate-environment: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and test Python
        run: |
          # Locked, hashed dependencies: what is tested here is what the deployed artifact was built from.
          uv export --frozen --no-emit-project --extra development --extra datasets --extra remote-storage > /tmp/requirements.txt
          uv pip install --require-hashes -r /tmp/requirements.txt
          uv pip install --no-deps -e .
          pytest -q
      - name: Run incremental type and patch checks
        run: uvx prek==0.5.7 run --all-files
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web
      - name: Verify generated frontend contracts
        run: |
          cp apps/web/src/generated.ts /tmp/dataset-atlas-generated.ts
          python scripts/generate_contracts.py
          cmp /tmp/dataset-atlas-generated.ts apps/web/src/generated.ts
      - name: Test frontend
        run: npm test --prefix apps/web
      - name: Build validated static data
        run: |
          python - <<'PY'
          from pathlib import Path
          from dataset_atlas.exports import build_publication
          report = build_publication(Path('registry'), Path('examples/approved-packs'), Path('apps/web/public'), Path('registry/publication.json'))
          print(f'catalogue={report.catalogue_count} preview_packs={len(report.published_packs)} data_bytes={report.total_bytes}')
          PY
      - name: Install Chromium for browser checks
        run: npx --prefix apps/web playwright install --with-deps --only-shell chromium
      - name: Exercise published browser
        run: npm run test:e2e --prefix apps/web
      - name: Exercise fresh source startup
        run: python scripts/verify_sample_startup.py --source
      - name: Build frontend at repository base path
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          ATLAS_BASE="/$repo_name/" npm run build --prefix apps/web
      - name: Check actual site size and base path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          dist = Path('apps/web/dist')
          entries = list(dist.rglob('*'))
          if any(p.is_symlink() for p in entries):
              raise SystemExit('Site contains a symlink')
          files = [p for p in entries if p.is_file()]
          forbidden = {'.pdf', '.pem', '.key', '.pkl', '.pickle', '.joblib', '.sqlite', '.db'}
          if any(p.suffix.lower() in forbidden or p.name.startswith('.env') for p in files):
              raise SystemExit('Site contains a forbidden private or executable artifact')
          size = sum(p.stat().st_size for p in files)
          if not files or size > 200_000_000:
              raise SystemExit(f'Invalid site size: {size} bytes')
          base = '/' + os.environ['GITHUB_REPOSITORY'].split('/', 1)[1] + '/'
          if base not in (dist / 'index.html').read_text():
              raise SystemExit(f'Built index does not contain repository base {base}')
          print(f'site_bytes={size}')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-atlas-static
          path: apps/web/dist
      - name: Build and inspect installable archives
        run: |
          python scripts/build_release.py --skip-npm-install
          python scripts/verify_distribution.py
      - name: Verify base-only installed wheel outside the checkout
        run: python scripts/verify_installation.py --output /tmp/atlas-installation-verification.json
      - name: Build compact sample handoff
        run: python scripts/build_sample_bundle.py --skip-npm-install
      - name: Verify portable sample archive and standalone startup
        run: |
          python scripts/verify_distribution.py --sample dist/dataset-atlas-samples.zip
          python scripts/verify_sample_startup.py --bundle dist/dataset-atlas-samples.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-atlas-samples
          path: |
            dist/dataset-atlas-samples.zip
            dist/dataset-atlas-samples.zip.sha256
          if-no-files-found: error
      # The wheel embeds the interface and the catalogue: `uv tool install` it, then `atlas init DIR` (docs/getting-started.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataset-atlas-wheel
          path: dist/*.whl

  python-supported:
    name: Latest supported workbench Python (3.14.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.14.10'
          activate-environment: true
      - name: Test latest supported Python patch and freshly resolved compatible dependencies
        run: |
          uv pip install -e '.[development,datasets,remote-storage]'
          pytest -q

  portable-current:
    name: Portable samples on current Python (3.15.2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.15.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dataset-atlas-samples
          path: dist
      - name: Verify standard-library-only portable launcher
        env:
          PYTHONPATH: src
        run: uv run --no-project --python 3.15.2 python scripts/verify_sample_startup.py --bundle dist/dataset-atlas-samples.zip

  deploy:
    # Only the reviewed default branch is ever published; also restrict the github-pages environment to main in the repository settings.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    needs: [build, python-supported, portable-current]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dataset-atlas-static
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
