# IllusionBench from the authors' Hugging Face release (MingZhangSJTU/IllusionBench; README title and authors match arXiv 2501.00848). Image_properties.json is the pinned
# annotation file; IllusionDataset.zip (924 MB) stays remote and is read by ETag-pinned ranges. The archive and the annotations disagree: declared_absent_media lists
# the 44 annotated images the archive lacks, and the adapter fails the preparation if that list differs from the archive's real directory.
release: hf-8ee046d8acfb968c1a6a564f231396bc0c4039ae
adapter: structured_collection
expected_count: 1041
scope: 'All 1,041 annotated entries of the authors'' Image_properties.json at the pinned Hugging Face revision (5,577 questions: 2,213 true/false
  and 3,364 multiple choice, with the authors'' answers and difficulty/category fields). The release is not consistent with itself or the paper
  (1,051 images and 5,548 questions): its archive holds 1,008 images, 997 match an annotation, 44 annotated entries have no image in the archive
  (kept as records with the image marked absent from the pinned release) and 11 archived images have no annotation (not indexed; named in the
  registry evidence). Images are read on request from the authors'' ETag-pinned archive.'
