expected_count: 4958
scope: 'All six author-released Whats-Up populations: Controlled A/B and COCO/VG one-
  and two-object caption comparisons. The first caption is correct by the author release
  contract. Controlled/VG original archive members retained locally; COCO val2017
  images fetched on request.'
adapter_config:
  annotations:
