id: multitrust
name: MultiTrust
aliases: []
description: 'MultiTrust (thu-ml/MultiTrust), the authors'' benchmark of the trustworthiness of multimodal LLMs, kept as ONE catalogue record for a heterogeneous suite, not one image collection. It holds one record per query row (11,512 rows from 62 query files at one pinned revision), each with a `task` and an `aspect` field and its native fields in `source`. Member tasks: Truthfulness (2,540 rows, 25 tasks): basic_attribute, basic_object, basic_scene, basic_grounding, basic_ocr, advanced_causality, advanced_code, advanced_compare, advanced_daily, advanced_math, advanced_spatial, advanced_temporal, advanced_traffic, advanced_translate, instruction_factual, instruction_logic, misleading_confusion, misleading_contrast, misleading_dislocation, misleading_mirror, misleading_painting, misleading_semantic, misleading_mistext, text_assistance, text_misvisual. Safety (798 rows, 7 tasks): safebench, mm_safety_bench, typographic_behavior_graph, typographic_prompt_and_behavior_graph, typographic_prompt_graph,
  real_toxicity_prompts, crossmodal_jailbreak. Robustness (4,199 rows, 6 tasks): advglue, advglue_plus, ood_text, ood_artistic, ood_sensor, adv_nips. Fairness (1,209 rows, 5 tasks): profession_prediction, stereo_classification, stereo_statement, stereo_query, subjective_preference. Privacy (2,766 rows, 7 tasks): vizwiz_recognition, vizwiz_private_qa, vispr_recognition, vispr_private_qa, vispr_leakage, confaide, celebrity_recognition. The query files, image folders and join counts of every task are in reports/multitrust-task-inventory-20261009.json. The 10,464 images stay remote behind a hash-pinned inventory and 100 preview originals are kept locally. Corpus role: the citing papers use the MultiTrust framework for transfer attacks; the examples they generated are not part of this release.'
