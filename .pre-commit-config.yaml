repos:
  - repo: local
    hooks:
      - id: ty-storage
        name: Type-check storage, preparation helpers and native adapters
        entry: uvx ty==0.0.83 check src/dataset_atlas/storage/compact.py src/dataset_atlas/storage/indexed_tar.py src/dataset_atlas/storage/indexed_zip.py src/dataset_atlas/storage/optimized.py src/dataset_atlas/storage/retention.py src/dataset_atlas/storage/usage.py src/dataset_atlas/preparation/sampling.py src/dataset_atlas/preparation/remote.py src/dataset_atlas/preparation/filtering.py src/dataset_atlas/preparation/slots.py src/dataset_atlas/adapters/remote_columnar.py src/dataset_atlas/storage/ranges.py src/dataset_atlas/adapters/nrc_vad.py src/dataset_atlas/adapters/text_pairs.py src/dataset_atlas/adapters/sad.py src/dataset_atlas/adapters/pathways.py src/dataset_atlas/adapters/textvqa_x.py src/dataset_atlas/storage/archive.py src/dataset_atlas/adapters/nocaps.py src/dataset_atlas/adapters/pathways_shapes.py src/dataset_atlas/adapters/find.py src/dataset_atlas/storage/multipart.py src/dataset_atlas/storage/remote_zip.py src/dataset_atlas/adapters/seed_bench.py src/dataset_atlas/adapters/vqa_constraints.py
        language: system
        pass_filenames: false
        files: ^(src/dataset_atlas/(storage/|preparation/|adapters/(nrc_vad|text_pairs|sad|remote_columnar|pathways|textvqa_x|nocaps|pathways_shapes|find|seed_bench|vqa_constraints).py)|pyproject.toml|uv.lock)
      - id: diff-whitespace
        name: Check patch whitespace
        entry: git diff --check
        language: system
        pass_filenames: false
