release: github-8eab34dbcbb49d9a9743b1f6ed26d48f74945a44
adapter: structured_collection
expected_count: 244242
scope: 'The author-released COCO-GB annotations at the pinned commit, as two separate
  release variants: v1 (123,287 images in the Karpathy split of COCO 2014 with the
  author''s four-valued gender integer, COCO category IDs, captions and a 1,000-image
  gender-balanced secret test) and v2 (120,955 image records in three reorganised
  train/test/fine-tune files). COCO IDs repeat across variants and partitions, so
  every row is scoped by variant and partition. The gender integer is the author''s
  native value, derived by the authors from caption words, not a perceived or self-reported
  identity; its coding is not documented for the JSON field itself. Images are COCO
  2014 files read on request from the ETag-pinned official archives, not mirrored.
  The captions are COCO''s; v2 fine-tune keeps only some of each image''s sentences.'
