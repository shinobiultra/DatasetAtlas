schema_version: '1.0'
id: sst2
name: SST-2 (GLUE distribution)
aliases:
- GLUE SST-2
- Stanford Sentiment Treebank binary
description: Local, split-preserving conversion of the GLUE SST-2 ZIP hosted by the GLUE baseline download
  script. This is the GLUE sentence-level binary release, not the full original Stanford Sentiment Treebank
  or an unseen-label test set.
paper_ids:
- paper-25eaa8c74ce76800
release: GLUE-SST-2-zip-2020-09-03
adapter: structured
adapter_config:
  path: work/sources/sst2/glue-sst2.parquet
  format: parquet
  sha256: 914641ca6a671b23acf504ca35f082beb83d188278c5ca9c26d8c3ce591efea4
  mapping:
    id: source_id
    text: sentence
  source_archive: work/sources/sst2/SST-2.zip
