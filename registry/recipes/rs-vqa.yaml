# RSVQA-LR from the author's Zenodo record (DOI 10.5281/zenodo.6344334). The nine split JSON files and the image archive match the record's
# published MD5 checksums; converters/remote_sensing.py joins each *active* question to its single answer and image (one row per question,
# 77,232 rows, matching the paper's published LR count) and extracts the 772 original TIFFs unchanged. Row and media digests are checked on
# every fetch. This is the Low Resolution release only: RS-VQA in the corpus is a survey-table mention that names no variant.
release: zenodo-6344334-v1.0
adapter: structured
expected_count: 77232
scope: 'All 77,232 questions of the author''s RSVQA-LR Zenodo release (record 6344334 v1.0, CC BY 4.0): the 57,223 train, 10,005 validation and
  10,004 test question/answer pairs over the 772 Sentinel-2 images, each with its native question type, annotator IDs and image sensor/geolocation
  fields. Images are the archive''s original 256x256 TIFFs, unchanged. RSVQA-HR and RSVQAxBEN are separate releases and are not prepared; the
  survey table that cites RS-VQA does not say which variant it means.'
source_url: https://zenodo.org/records/6344334
