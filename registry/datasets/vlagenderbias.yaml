description: 'VLAGenderBias (Girrbach et al., ICLR 2025, arXiv 2410.19314): a gender-bias
  evaluation built by the authors'' scripts from FairFace (two margins), MIAP, PHASE
  and PATA, not a separately released image collection. The 5,000-image gender-balanced
  evaluation the paper describes is a deterministic selection those scripts make over
  locally downloaded sources.'
