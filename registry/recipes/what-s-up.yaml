    correct_choice_index: 0
    text_from_first_choice: true
    array_columns:
    - image_id
    - true_caption
    - false_caption
    choices_columns:
    - true_caption
    - false_caption
    media_archive: vg_images
    media_template: vg_images/{image_id}.jpg
  - path_key: vg_qa_two_obj_annotations
    split: vg_qa_two_obj
    correct_choice_index: 0
    text_from_first_choice: true
    array_columns:
    - image_id
    - true_caption
    - false_caption
    choices_columns:
    - true_caption
    - false_caption
    media_archive: vg_images
    media_template: vg_images/{image_id}.jpg
  local_archives:
    controlled_images:
      path_key: controlled_images_path
    controlled_clevr:
      path_key: controlled_clevr_path
    vg_images:
      path_key: vg_images_path
  repack_paths:
  - controlled_images_path
  - controlled_clevr_path
  - vg_images_path
  remote_archives:
    val2017:
      url: https://s3.amazonaws.com/images.cocodataset.org/zips/val2017.zip
      bytes: 815585330
      etag: '"d366be60d3dc737327160d62453e3973-98"'
      allowed_hosts:
      - s3.amazonaws.com
  remote_cache_root: work/media-cache/whatsup
  mapping:
    text: _atlas_text
    choices: _atlas_choices
