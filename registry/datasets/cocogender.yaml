schema_version: '1.0'
id: cocogender
name: COCOgender
aliases:
- Cocogender
description: 'COCO-GB (Tang et al., WWW 2021) as released by its authors: v1 (123,287 COCO 2014 images with a four-valued
  gender integer, category IDs, captions and a 1,000-image gender-balanced secret test) and v2 (120,955 image records
  in reorganised train/test/fine-tune files), kept as separate variants. The DeBiasLens paper''s ''Cocogender''
  cites this work but does not say which variant or subset it used, so identity stays a candidate.'
paper_ids:
- paper-32cea5e43d940514
release: github-8eab34dbcbb49d9a9743b1f6ed26d48f74945a44
adapter: structured_collection
adapter_config:
  annotations:
  - path_key: path
    format: jsonl
    split: all
    identity_prefix: coco-gb
    media_path_url_field: coco_url
    media_archive_by_prefix:
      train2014: train2014
      val2014: val2014
  mapping:
    id: source_id
    text: display_text
  max_annotation_bytes: 400000000
  remote_archives:
    train2014:
      url: https://s3.amazonaws.com/images.cocodataset.org/zips/train2014.zip
      bytes: 13510573713
      etag: '"289af3433b84b5b8622626b10146c1bc-1611"'
      allowed_hosts:
      - s3.amazonaws.com
    val2014:
      url: https://s3.amazonaws.com/images.cocodataset.org/zips/val2014.zip
      bytes: 6645013297
      etag: '"3925cc4d50eb68d47bf2d6324a012d20-793"'
      allowed_hosts:
      - s3.amazonaws.com
  remote_cache_root: work/media-cache/ranges
  fields:
    source_id: Release variant, partition and COCO image ID
    release_variant:
      description: COCO-GB release variant
      values:
      - v1
      - v2
    partition:
      description: v1 Karpathy split, or v2 file (train, test, fine_tune)
      values:
      - train
      - restval
      - val
      - test
      - fine_tune
    split:
      description: Native 'split' field (v2 keeps Karpathy-style labels even in its test file)
      values:
      - train
      - restval
      - val
      - test
    cocoid:
      description: COCO image ID
      dtype: number
    imgid:
      description: Native image index within its file
      dtype: number
    filepath:
      description: COCO 2014 folder
      values:
      - train2014
      - val2014
    filename: COCO image file name
    gender:
      description: Author's native gender integer, derived from caption words (absent in v2 fine_tune); coding not
        documented for this field
      dtype: number
    category_id: Native COCO category ID string (absent in v2 fine_tune)
    category_ids:
      description: The category IDs parsed to integers
      dtype: array
    captions: Captions present in this record
    caption_ids: IDs of the captions present
    listed_sentence_ids: Native sentence ID list (may name captions this record omits)
    captions_subset_of_listed:
      description: True when the record keeps fewer sentences than it lists
      dtype: boolean
    secret_test:
      description: 'v1: in the author''s gender-balanced 1,000-image secret test (absent for v2)'
      dtype: boolean
    display_text: First caption, for display
    coco_url: Canonical COCO image URL used only to name the archive member
coverage:
  identity: candidate
  source: verified
  access: public
  adapter: not_started
  preview: none
  complete_data: unimplemented
  publication: not_reviewed
  preview_count: 0
  unit: example
  blockers:
  - The DeBiasLens paper cites Tang et al. 2021 for 'Cocogender' without naming v1, v2 or the subset it trained
    on, so the exact paper population is unresolved.
  - The gender integer is the authors' native value, derived from caption words (not perceived or self-reported
    identity); the repository does not document the JSON field's own coding, so Atlas does not name its values.
  - COCO images keep their per-image Flickr licences and are read on request from COCO's official archives; no public
    redistribution review.
