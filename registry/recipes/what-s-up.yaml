    media_archive: controlled_clevr
    choices_field: caption_options
  - path_key: coco_qa_one_obj_annotations
    split: coco_qa_one_obj
    correct_choice_index: 0
    text_from_first_choice: true
    array_columns:
    - image_id
    - true_caption
    - false_caption
    choices_columns:
    - true_caption
    - false_caption
    media_archive: val2017
    media_stem_field: image_id
    media_stem_width: 12
    media_template: val2017/{_stem}.jpg
  - path_key: coco_qa_two_obj_annotations
    split: coco_qa_two_obj
    correct_choice_index: 0
    text_from_first_choice: true
    array_columns:
