    join_basis: key_in_query_row
    toolkit_tasks:
    - safebench
  - task: mm_safety_bench
    aspect: safety
    query_file: safety/mm-safety-bench-selected/mm-safety-bench-selected.json
    format: json_keyed
    key_field: _key
    media:
    - template: safety/mm-safety-bench-selected/{Image}
    join_basis: key_in_query_row
    toolkit_tasks:
    - mm-safety-bench
  - task: typographic_behavior_graph
    aspect: safety
    query_file: safety/typographic_jailbreak/behavior_graph.csv
    format: csv
    media:
    - template: safety/typographic_jailbreak/behavior_graph/{image_path}
    join_basis: key_in_query_row
    toolkit_tasks:
    - typographic-behavior
  - task: typographic_prompt_and_behavior_graph
    aspect: safety
    query_file: safety/typographic_jailbreak/prompt_and_behavior_graph.csv
    format: csv
    media:
    - template: safety/typographic_jailbreak/prompt_and_behavior_graph/{image_path}
    join_basis: key_in_query_row
    toolkit_tasks:
    - typographic-prompt-and-behavior
  - task: typographic_prompt_graph
    aspect: safety
    query_file: safety/typographic_jailbreak/prompt_graph.csv
    format: csv
    media:
    - template: safety/typographic_jailbreak/prompt_graph/{image_path}
    join_basis: key_in_query_row
    toolkit_tasks:
    - typographic-prompt
  - task: real_toxicity_prompts
    aspect: safety
    query_file: safety/real_toxicity_prompt/prompts_select.json
    format: json_groups
    group_field: category
    string_item_field: prompt
    media:
    - template: safety/real_toxicity_prompt/images/{_group}_{prompt|md5}.png
    join_basis: derived_key
    toolkit_tasks:
    - toxicity-prompt-image
    note: The image name is the category plus the MD5 of the prompt text, as the authors loader derives it.
  - task: crossmodal_jailbreak
    aspect: safety
    query_file: safety/crossmodal-jailbreak/text_jailbreak.csv
    format: csv
    media: []
    join_basis: none_cross_product_in_toolkit
    toolkit_tasks:
    - crossmodal-jailbreak
    note: The authors loader pairs every prompt with every image of jailbreak_pos or jailbreak_neg; there is no row-level image key, so no image is joined.
  - task: advglue
    aspect: robustness
    query_file: robustness/advglue/label.json
    format: json_groups
    group_field: category
    media:
    - template: robustness/advglue/related/{_group}/{idx}.png
    join_basis: derived_key
    toolkit_tasks:
    - advglue-text
    - advglue-related-image
    note: The related image is related/<category>/<idx>.png, as the authors loader derives it.
  - task: advglue_plus
    aspect: robustness
    query_file: robustness/advglue_plus/label.json
    format: json_groups
    group_field: category
    media:
    - template: robustness/advglue_plus/related/{_group}/{idx}.png
    join_basis: derived_key
    toolkit_tasks:
    - advglue-plus-text
    - advglue-plus-related-image
    note: The related image is related/<category>/<idx>.png, as the authors loader derives it.
  - task: ood_text
    aspect: robustness
    query_file: robustness/ood-text/label.json
    format: json_groups
    group_field: category
    media:
    - template: robustness/ood-text/related/{id}.png
    join_basis: derived_key
    toolkit_tasks:
    - dt-text
    - dt-related-image
    note: The related image is related/<id>.png; the authors loader reuses the 100 images across the ten categories.
  - task: ood_artistic
    aspect: robustness
    format: jsonl
    query_files:
    - robustness/ood-artistic/label/cartoon.json
    - robustness/ood-artistic/label/handmake.json
    - robustness/ood-artistic/label/painting.json
    - robustness/ood-artistic/label/sketch.json
    - robustness/ood-artistic/label/tattoo.json
    - robustness/ood-artistic/label/weather.json
    media:
    - template: robustness/ood-artistic/source/{image_name}
    join_basis: key_in_query_row
    toolkit_tasks:
    - ood-artistic
  - task: ood_sensor
    aspect: robustness
    format: jsonl
    query_files:
    - robustness/ood-sensor/label/ct.json
    - robustness/ood-sensor/label/driving.json
    - robustness/ood-sensor/label/hxray.json
    - robustness/ood-sensor/label/infrared.json
    - robustness/ood-sensor/label/lxray.json
    - robustness/ood-sensor/label/mri.json
    - robustness/ood-sensor/label/remote.json
    media:
    - template: robustness/ood-sensor/source/{image_name}
    join_basis: key_in_query_row
    toolkit_tasks:
    - ood-sensor
  - task: adv_nips
    aspect: robustness
    query_file: robustness/adv_nips/label.json
    format: jsonl
    media:
    - template: robustness/adv_nips/source/clean/{image_name}
      role: clean
    - template: robustness/adv_nips/source/target/{image_name}
      role: targeted_attack
    - template: robustness/adv_nips/source/untarget/{image_name}
      role: untargeted_attack
    join_basis: key_in_query_row
    toolkit_tasks:
    - adversarial-target
    - adversarial-untarget
  - task: profession_prediction
    aspect: fairness
    query_file: fairness/profess_prediction.csv
    format: csv
    media:
    - template: fairness/profession_images/{filename}
    join_basis: key_in_query_row
    toolkit_tasks:
    - profession-pred
  - task: stereo_classification
    aspect: fairness
    query_file: fairness/stereo_classification.csv
    format: csv
    media:
    - template: fairness/stereo_classification_images/{Number}.png
    join_basis: key_in_query_row
    toolkit_tasks:
    - stereo-classification-image
  - task: stereo_statement
    aspect: fairness
    query_file: fairness/stereo_statement.csv
    format: csv
    media:
    - template: fairness/stereo_images/{Type|lower}/{Number}.png
    join_basis: derived_key
    toolkit_tasks:
    - stereo-agreement-image
    - stereo-topic-classification
    note: One file serves two authors tasks; the image is stereo_images/<type lower-cased>/<number>.png.
  - task: stereo_query
    aspect: fairness
    query_file: fairness/stereo_query.csv
    format: csv
    media: []
    join_basis: none_listdir_order_in_toolkit
    toolkit_tasks:
    - stereo-query-image
    note: The authors loader pairs the 95 questions with stereo_query_images in os.listdir order, which is not a stable key; no image is joined.
  - task: subjective_preference
    aspect: fairness
    query_file: fairness/preference.json
    format: json
    row_modulo: 120
    media:
    - template: fairness/vision_subjective_choice_images/{_row}.png
      role: vision_preference_image
      row_lt: 120
    - template: fairness/subjective_choice_images/choice_a_images/{_row_mod1}.png
      role: subjective_choice_a_candidate
    - template: fairness/subjective_choice_images/choice_b_images/{_row_mod1}.png
      role: subjective_choice_b_candidate
    join_basis: ordinal_in_toolkit_loader
    toolkit_tasks:
    - subjective-preference-plain-image
    - subjective-preference-force-image
    - vision-preference
    note: Image k belongs to rows k and k+120. The vision-preference loader takes the first 120 rows in numeric image order; the subjective loader picks choice_a or choice_b at random per run, so both candidates are attached with a role.
  - task: vizwiz_recognition
    aspect: privacy
    query_file: privacy/vizwiz-priv/Annotations/Vizwiz-Priv-Recognition.json
    format: json
    media:
    - template: privacy/vizwiz-priv/Filling_Images/{image}
      role: filled_private_regions
    join_basis: key_in_query_row
    toolkit_tasks:
    - vizwiz-recognition
  - task: vizwiz_private_qa
    aspect: privacy
    query_file: privacy/vizwiz-priv/Annotations/Vizwiz-Priv-QA-Private.json
    format: json
    media:
    - template: privacy/vizwiz-priv/Filling_Images/{image}
      role: filled_private_regions
    - template: privacy/vizwiz-priv/Image_draw_line/{image}
      role: private_regions_outlined
    join_basis: key_in_query_row
    toolkit_tasks:
    - vizwiz-recognition-pri-query
    - vizwiz-drawline-recognition-pri-query
  - task: vispr_recognition
    aspect: privacy
    query_file: privacy/vispr/sampled_vispr_test2017.jsonl
    format: jsonl
    media:
    - template: privacy/vispr/test2017/{image}
    join_basis: key_in_query_row
    toolkit_tasks:
    - vispr-recognition
  - task: vispr_private_qa
    aspect: privacy
    query_file: privacy/vispr/vispr_question_gpt4_generated_chosen.json
    format: json
    media:
    - template: privacy/vispr/test2017/{image}
    join_basis: key_in_query_row
    toolkit_tasks:
    - vispr-recognition-pri-query
  - task: vispr_leakage
    aspect: privacy
    query_file: privacy/vispr/categorized/image_annotations.json
    format: jsonl
    media:
    - template: privacy/vispr/categorized/{SheetName}/{Img Path}
    join_basis: key_in_query_row
    toolkit_tasks:
    - vispr-leakage
  - task: confaide
    aspect: privacy
    query_file: privacy/confaide/prompts.txt
    format: text_lines
    companion_lines:
      source_name: privacy/confaide/labels.txt
      field: label
    row_modulo: 14
    media:
    - template: privacy/confaide/imgs/{_row_mod}.png
    join_basis: ordinal_in_toolkit_loader
    toolkit_tasks:
    - confaide-image
    note: The authors loader pairs prompt i with image i modulo 14 and the i-th label line.
  - task: celebrity_recognition
    aspect: privacy
    query_file: privacy/celeb/celebrities.csv
    format: csv
    media:
    - template: privacy/celeb/imgs/{Celebrity|underscore}.jpeg
    join_basis: derived_key
    toolkit_tasks:
    - celebrities
    note: The image is imgs/<name with underscores>.jpeg; the Url column points to an external site and is never fetched.
